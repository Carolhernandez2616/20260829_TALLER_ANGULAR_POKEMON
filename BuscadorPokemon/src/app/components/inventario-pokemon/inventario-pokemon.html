<div>
    <h2>El mochila de los Pokémon</h2>
    <p>Total en almacen:<strong>{{ pokemonService.misPokemons().length }}</strong></p>
</div>

<div class="grid-pokemon">
    @for(poke of pokemonService.misPokemons(); track poke.id; let idx = $index; let total = $count) {
        <div appResaltarTarjeta class="item-inventario" [ngClass]="{'favorito-activo': poke.esFavorito}">
        <span class="posicion-badge">#{{ idx + 1 }} de {{ total }}</span>
        <img [src]="poke.image"/>
       <h4>{{ poke.name }}</h4>
       <p>{{poke.type}}</p>
       
       <div class="acciones">
        <button (click)="pokemonService.actualizarFavorito(poke.id)" [class.btn-fav] = "poke.esFavorito">
        {{ poke.esFavorito ? 'Favorito': 'Marcar'}}
        </button>
        <button class="btn-eliminar" (click)="pokemonService.eliminarPokemon(poke.id)">
        Liberar
        </button>
       </div>
  </div>  
</div>
