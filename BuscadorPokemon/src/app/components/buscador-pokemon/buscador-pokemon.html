<form (submit)="buscarPokemon()">
  <div>
    <label>Inserte el nombre del Pokémon:</label>
        <input
    type="text"
    [(ngModel)]="nombrePokemonInput" 
    name="nombrePokemon"
    placeholder="Ej. Pikachu ,Charizard, Bulbasaur"
    required
    />
  </div>
  <div>
     <button type="submit">Buscar</button>

  </div>

</form>
<div id="resultadoPokemon">
    @if(pokemon(); as p){
        <div>
            <h2>{{ p.name }}</h2>
            <img [src]="p.image" [alt]="p.name" />
            <p><strong>Elementos:</strong> {{ p.type }}</p>
        </div>

    }@else if(!mensajeError()){
      <p> Error con Aura </p>
    }
</div>
